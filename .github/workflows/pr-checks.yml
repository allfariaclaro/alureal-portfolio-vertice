name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check vertice-app.js
      - run: node --test tests/*.test.cjs
